<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Demande aux moteurs de recherche (Google…) de ne pas référencer la page -->
<meta name="robots" content="noindex, nofollow">
<title>Aide d'urgence</title>
<!-- VITESSE : on télécharge moteur.js tout de suite, en même temps que le profil,
     au lieu d'attendre que le profil et le scénario soient arrivés (un aller-retour réseau de gagné). -->
<link rel="preload" href="moteur.js" as="script">
<!-- INSTALLABLE COMME UNE APPLI ("Ajouter à l'écran d'accueil").
     Le manifest n'a volontairement PAS de "start_url" : l'icône rouvre alors l'adresse
     exacte depuis laquelle on l'a installée, donc avec le bon profil (?p=…). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#b3261e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Urgence">
<style>
  /* ---------- 1. COULEURS ----------
     Contraste fort, lisible en plein soleil.
     IMPORTANT : aucune animation clignotante sur cette page (risque pour une personne épileptique). */
  :root {
    --fond: #f7f7f5;
    --texte: #111;
    --carte: #fff;
    --bordure: #d9d9d4;
    --accent: #1f5fbf;      /* bleu calme */
    --alerte: #b3261e;      /* rouge appel */
    --ok: #1e7a3c;          /* vert fin de crise */
    --doux: #555;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 19px; line-height: 1.4;
  }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 150px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  h2 { font-size: 18px; margin: 24px 0 8px; }
  h3 { font-size: 15px; margin: 14px 0 6px; color: var(--doux); text-transform: uppercase; letter-spacing: .03em; }

  /* Bandeau du mode entraînement */
  #bandeau-test {
    background: #ffe08a; border: 2px dashed #a07800; border-radius: 12px;
    padding: 8px 12px; font-weight: 700; font-size: 16px; text-align: center; margin-bottom: 8px;
  }

  /* Sélecteur de langue */
  #langues { display: flex; gap: 6px; justify-content: flex-end; }
  #langues button { flex: 0 0 auto; padding: 6px 10px; font-size: 15px; border-radius: 8px; }
  #langues button.actif { background: var(--texte); color: #fff; border-color: var(--texte); }

  /* ---------- 2. CHRONO ---------- */
  #chrono-box {
    background: var(--carte); border: 2px solid var(--bordure); border-radius: 16px;
    padding: 16px; text-align: center;
  }
  #chrono { font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #chrono-info { margin-top: 6px; color: var(--doux); font-size: 16px; }
  /* Au-delà du seuil : la carte devient rouge (fixe, PAS de clignotement) */
  /* Crises qui s'enchaînent (.repetee) : même rouge fixe */
  #chrono-box.depasse, #chrono-box.repetee { background: var(--alerte); border-color: var(--alerte); color: #fff; }
  #chrono-box.depasse #chrono-info, #chrono-box.repetee #chrono-info { color: #fff; }
  #alerte-5min, #alerte-repetee { display: none; font-weight: 700; margin-top: 8px; font-size: 20px; }
  #chrono-box.depasse #alerte-5min, #chrono-box.repetee #alerte-repetee { display: block; }

  /* ---------- 3. BOUTONS ---------- */
  .ligne { display: flex; gap: 8px; margin-top: 10px; }
  button, .btn {
    flex: 1; display: block; text-align: center; text-decoration: none;
    font: inherit; font-weight: 600; padding: 14px 10px; border-radius: 12px;
    border: 2px solid var(--bordure); background: var(--carte); color: var(--texte); cursor: pointer;
  }
  .btn-appel { background: var(--alerte); border-color: var(--alerte); color: #fff; font-size: 21px; }
  .btn-parent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-fin { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn-voix.actif { background: var(--texte); color: #fff; border-color: var(--texte); }

  /* ---------- 4. ÉTAPES AVEC PICTOGRAMMES ---------- */
  ul.etapes { padding: 0; margin: 0; list-style: none; }
  ul.etapes li {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--carte); border: 1px solid var(--bordure);
    border-radius: 12px; padding: 12px; margin-bottom: 8px;
  }
  .ico {
    flex: 0 0 44px; height: 44px; border-radius: 50%; background: #e8eef9;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .non { color: var(--alerte); font-weight: 700; }
  .encadre { background: #fff4e5; border: 1px solid #f0c27b; border-radius: 12px; padding: 12px; }
  #protocole { white-space: pre-line; }   /* garde les retours à la ligne du protocole */

  /* ---------- 5. OBSERVATIONS ---------- */
  .obs-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .obs-grille button { font-size: 15px; padding: 10px 6px; }
  .obs-grille button .ico-obs { display: block; font-size: 22px; }
  /* Petit compteur sur un bouton déjà utilisé */
  .obs-grille button .nb {
    display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 5px; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 12px;
  }

  #journal { margin-top: 14px; }
  #obs-liste { list-style: none; padding: 0; margin: 0; }
  #obs-liste li {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid var(--bordure); font-size: 16px;
  }
  #obs-liste li .txt { flex: 1; }
  #obs-liste li .temps { font-variant-numeric: tabular-nums; font-weight: 700; }
  #obs-liste li button { flex: 0 0 auto; padding: 6px 10px; font-size: 14px; border-radius: 8px; }
  /* Observation annulée : on la garde, mais barrée et grisée */
  #obs-liste li.annule .txt { text-decoration: line-through; color: #999; }

  /* Barre d'appel fixée en bas : toujours accessible même en faisant défiler */
  #barre-bas {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px;
    background: var(--fond); border-top: 1px solid var(--bordure);
  }
  #barre-bas .ligne { max-width: 560px; margin: 0 auto; }
  /* Position GPS lisible au téléphone, juste au-dessus des boutons d'appel */
  #position {
    max-width: 560px; margin: 0 auto 4px; text-align: center;
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
  }

  #recap { display: none; }
  .cache { display: none !important; }
  .petit { font-size: 14px; color: var(--doux); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <!-- Les textes entre balises sont remplis par le JavaScript selon la langue choisie.
       data-t="cle" = "mets ici le texte TEXTES[langue].cle" -->
  <div id="bandeau-test" class="cache" data-t="bandeauTest"></div>
  <div id="langues"></div>
  <h1 id="titre"></h1>

  <section id="chrono-box" aria-live="polite">
    <div id="chrono">00:00</div>
    <div id="chrono-info"></div>
    <div id="alerte-5min" data-t="alerte"></div>
    <div id="alerte-repetee" data-t="alerteRepetee"></div>
  </section>
  <div id="statut-ntfy" class="petit cache"></div>

  <div class="ligne"><button id="btn-plus1" data-t="plus1"></button></div>
  <div class="ligne"><button id="btn-voix" class="btn-voix" data-t="voix"></button></div>
  <div class="ligne">
    <button id="btn-sms" data-t="sms"></button>
    <button id="btn-fin" class="btn-fin" data-t="fin"></button>
  </div>

  <!-- RÉCAP : s'affiche quand on appuie sur "terminée" -->
  <section id="recap">
    <h2 data-t="recapTitre"></h2>
    <div class="encadre" id="recap-texte"></div>
    <div class="ligne"><button id="btn-copier" data-t="copier"></button></div>
    <div class="ligne"><button id="btn-reprendre" data-t="reprendre"></button></div>
    <div class="ligne"><button id="btn-nouvelle" class="btn-appel" data-t="nouvelle"></button></div>
  </section>

  <section>
    <h2 data-t="pendantTitre"></h2>
    <ul class="etapes" id="liste-pendant"></ul>
  </section>

  <section>
    <h2 data-t="obsTitre"></h2>
    <div id="obs-groupes"></div>
    <div id="journal" class="cache">
      <h3 data-t="journalTitre"></h3>
      <ul id="obs-liste"></ul>
    </div>
  </section>

  <section>
    <h2 data-t="apresTitre"></h2>
    <ul class="etapes" id="liste-apres"></ul>
  </section>

  <section>
    <h2 data-t="appelTitre"></h2>
    <div class="encadre" data-t="appelTexte"></div>
  </section>

  <section id="bloc-protocole" class="cache">
    <h2 data-t="protocoleTitre"></h2>
    <div class="encadre" id="protocole"></div>
  </section>
</main>

<div id="barre-bas">
  <div id="position" class="cache"></div>
  <div class="ligne">
    <a class="btn btn-appel" id="btn-15" href="tel:15" data-t="appel15"></a>
    <a class="btn btn-parent cache" id="btn-parent" href="#"></a>
  </div>
</div>

<!-- D'OÙ VIENT LE PROFIL DE L'ENFANT ? Trois cas, dans cet ordre :
     A. Dans l'adresse, après le # (cas normal, fabriqué par le générateur) :
        https://…/CRISE/#p=L%C3%A9o&g=m&t=0612345678&n=sa+maman
        La partie après # n'est JAMAIS envoyée au serveur : le profil n'est stocké
        nulle part sur GitHub, seulement dans le tag NFC / QR code.
     B. Dans un fichier : index.html?p=k7f3x9a2 → profils/k7f3x9a2.js (exemple fictif)
     C. Rien : profil "demo" (aucune donnée personnelle).
     Ensuite : scenarios/xxx.js (les consignes), puis moteur.js (le fonctionnement). -->
<script>
  const parametres = new URLSearchParams(location.search);
  let donneesProfil = new URLSearchParams(location.hash.slice(1));

  /* Appli installée sur l'écran d'accueil : certains téléphones perdent la partie après #.
     On garde donc le profil de l'appli au moment de l'installation, et on le reprend ici. */
  const enAppli = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const CLE_PROFIL_APPLI = "crise:profil-appli";
  try {
    if (donneesProfil.toString() && enAppli) localStorage.setItem(CLE_PROFIL_APPLI, donneesProfil.toString());
    if (!donneesProfil.toString() && !parametres.has("p") && enAppli) {
      donneesProfil = new URLSearchParams(localStorage.getItem(CLE_PROFIL_APPLI) || "");
    }
  } catch (e) {}
  window.addEventListener("appinstalled", () => {
    try { if (donneesProfil.toString()) localStorage.setItem(CLE_PROFIL_APPLI, donneesProfil.toString()); } catch (e) {}
  });

  const PROFIL_DANS_ADRESSE = donneesProfil.toString() !== "";

  // Si le # change alors que la page est déjà ouverte (autre tag scanné), on recharge
  // pour afficher le bon enfant (sinon le navigateur garderait l'ancien).
  window.addEventListener("hashchange", () => location.reload());

  // Petite empreinte du profil (pour séparer les sauvegardes de deux enfants différents)
  function empreinte(texte) {
    let h = 5381;
    for (const c of texte) h = (h * 33 + c.codePointAt(0)) >>> 0;
    return h.toString(36);
  }
  const PROFIL = PROFIL_DANS_ADRESSE ? "adr-" + empreinte(donneesProfil.toString()) : (parametres.get("p") || "demo");

  /* Profil lu dans l'adresse. Lettres courtes pour que l'adresse tienne dans un tag NFC :
     s = situation, p = prénom, g = genre, t = téléphone, n = nom du parent,
     c = canal ntfy, m = minutes avant l'alerte, v = vidéo (1 = oui), r = protocole */
  function profilDepuisAdresse(d) {
    const canal = d.get("c") || "";
    return {
      scenario: d.get("s") || "epilepsie",
      prenom: (d.get("p") || "").slice(0, 40),
      genre: d.get("g") === "f" ? "f" : "m",
      telParent: d.get("t") || "",
      nomParent: (d.get("n") || "").slice(0, 40),
      protocole: d.get("r") || "",
      seuilAlerteMin: parseInt(d.get("m"), 10) > 0 ? parseInt(d.get("m"), 10) : null,
      consigneVideo: d.get("v") === "1",
      // SÉCURITÉ : le canal finit dans l'adresse ntfy, on n'accepte que lettres, chiffres, - et _
      ntfyCanal: /^[A-Za-z0-9_-]{1,64}$/.test(canal) ? canal : ""
    };
  }

  function chargerScript(adresse) {
    return new Promise((ok, echec) => {
      const s = document.createElement("script");
      s.src = adresse;
      s.onload = ok;
      s.onerror = () => echec(adresse);
      document.body.appendChild(s);
    });
  }

  // Message clair si quelque chose manque (au lieu d'une page blanche),
  // avec quand même un vrai bouton pour appeler le 15.
  function erreur(fichier) {
    document.body.innerHTML =
      "<main><h1>Appelez le 15</h1>" +
      "<a class='btn btn-appel' href='tel:15'>Appeler le 15</a>" +
      "<p>Fichier introuvable : <strong id='fichier-manquant'></strong></p>" +
      "<p style='font-size:15px;color:#555'>Pour le créateur de la page : vérifiez l'adresse (?p=…) " +
      "et que le fichier existe bien dans le dossier.</p></main>";
    /* SÉCURITÉ : le nom vient de l'adresse, donc n'importe qui peut y écrire du code HTML.
       textContent l'affiche comme du simple texte, sans jamais l'exécuter. */
    document.getElementById("fichier-manquant").textContent = fichier;
  }

  /* SÉCURITÉ : on n'accepte que des noms faits de lettres minuscules, chiffres et tirets.
     Sans ce contrôle, quelqu'un pourrait écrire ?p=../autre-chose dans l'adresse
     pour faire charger un fichier qui n'est pas un profil. */
  const nomValide = nom => /^[a-z0-9-]{1,40}$/.test(nom);

  if (!nomValide(PROFIL)) {
    erreur("profil « " + PROFIL + " » (nom invalide)");
  } else {
    // Cas A : profil dans l'adresse → pas de fichier à charger. Cas B et C : on charge le fichier.
    const profilPret = PROFIL_DANS_ADRESSE
      ? Promise.resolve(window.CONFIG = profilDepuisAdresse(donneesProfil))
      : chargerScript("profils/" + PROFIL + ".js");
    profilPret
      .then(() => {
        if (typeof CONFIG === "undefined" || !nomValide(CONFIG.scenario)) throw "profil (contenu incorrect)";
        return chargerScript("scenarios/" + CONFIG.scenario + ".js");
      })
      .then(() => chargerScript("moteur.js"))
      .catch(erreur);
  }
</script>
</body>
</html>
